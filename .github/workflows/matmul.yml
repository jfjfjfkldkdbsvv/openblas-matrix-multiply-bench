name: OpenBLAS Matrix-Multiply Benchmark

on:
  push:
    paths:
      - 'sgemm_bench.c'
      - '.github/workflows/matmul.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CPU info + flags
        run: |
          echo "== CPU model =="
          lscpu | grep -E 'Model name|Socket|Core|Thread|CPU\(s\)|Architecture' || true
          echo "== nproc =="
          nproc
          echo "== SIMD flags =="
          grep -m1 -oE 'avx512f|avx2|avx|fma|sse4_2' /proc/cpuinfo | sort -u || true

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev gcc

      - name: Build benchmark
        run: |
          gcc -O3 -march=native -o sgemm_bench sgemm_bench.c -lopenblas -lpthread -lm
          echo "OpenBLAS: $(dpkg -l | grep -m1 openblas-dev | awk '{print $3}')"

      - name: Run (1 thread)
        env: { OPENBLAS_NUM_THREADS: "1" }
        run: ./sgemm_bench 8192

      - name: Run (2 threads)
        env: { OPENBLAS_NUM_THREADS: "2" }
        run: ./sgemm_bench 8192

      - name: Run (4 threads)
        env: { OPENBLAS_NUM_THREADS: "4" }
        run: ./sgemm_bench 8192
